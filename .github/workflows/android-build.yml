name: Android CI

on:
  push:
    branches: [main, fishing-idle-android]
    paths:
      - 'FishingIdle/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'FishingIdle/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FishingIdle

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 配置 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 运行单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Release / Debug APK
        run: ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: 校验签名
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          ls -la "$APK"
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --verbose "$APK"
          echo "sha256:"
          sha256sum "$APK"

      - name: 上传 APK 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fishing-idle-apk-${{ github.run_number }}
          path: |
            FishingIdle/app/build/outputs/apk/release/*.apk
            FishingIdle/app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: 发布到 Release（附下载直链）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 钓鱼大师 v1.0.${{ github.run_number }}
          body: |
            自动化构建产物。

            - 构建号：`${{ github.run_number }}`
            - 提交：`${{ github.sha }}`
            - 触发：`${{ github.event_name }}`

            下载下方 Assets 中的 `app-release.apk` 即可安装（Android 7.0+）。
          files: |
            FishingIdle/app/build/outputs/apk/release/*.apk
            FishingIdle/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
