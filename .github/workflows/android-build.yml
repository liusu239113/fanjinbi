name: Android CI

on:
  push:
    branches: [main, fishing-idle-android]
    paths:
      - 'FishingIdle/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'FishingIdle/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FishingIdle

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 注意：不能省略 packages —— 该 action 默认会安装 'tools' 包，
      # 而 'tools' 在新版 SDK 仓库中已被移除，会导致 sdkmanager 退出码 1。
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: 配置 Gradle（含缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 运行单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # 只出正式签名包：release 用 build.gradle.kts 里配置的 keystore 签名，
      # 不再产出 debug 包。
      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 校验签名
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          ls -la "$APK"
          APKSIGNER=$(find "${ANDROID_SDK_ROOT}" -name apksigner -type f -path '*build-tools*' | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          echo "sha256:"
          sha256sum "$APK"

      - name: 上传 APK 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: fishing-idle-apk-${{ github.run_number }}
          path: FishingIdle/app/build/outputs/apk/release/*.apk
          retention-days: 90

      # tag 固定为 latest-<分支>：每次构建覆盖更新同一个 Release，
      # 下载地址始终稳定，也不会在仓库里堆一堆历史 tag。
      - name: 发布到 Release（附下载直链）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: 钓鱼大师 · ${{ github.ref_name }}
          body: |
            自动化构建产物，随最新提交更新。

            - 构建号：`${{ github.run_number }}`
            - 提交：`${{ github.sha }}`
            - 触发：`${{ github.event_name }}`

            下载下方 Assets 中的 `app-release.apk` 即可安装（Android 7.0+）。
          files: |
            FishingIdle/app/build/outputs/apk/release/*.apk
            FishingIdle/app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: true
          make_latest: false
