name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 签名必须**每次都一样**，否则新包装不到旧包上，
      # 玩家只能先卸载（存档一起没）。所以 keystore/fishingidle.jks
      # 是提交进仓库的固定签名，只有真的丢了才临时补一个。
      - name: 准备签名密钥
        run: |
          if [ -f keystore/fishingidle.jks ]; then
            echo "使用仓库里的固定签名文件 keystore/fishingidle.jks"
          else
            echo "::warning::仓库里没有签名文件，本次临时生成一个 —— 这样构建出来的包和之前的签名不一致，装上去要先卸载"
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/fishingidle.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias fishingidle \
              -storepass fishingidle -keypass fishingidle \
              -dname "CN=Fishing Idle, OU=Game, O=TapTap, L=Shanghai, ST=Shanghai, C=CN"
          fi

      - name: 运行单元测试
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: 构建 Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 收集产物
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/钓鱼大师-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/钓鱼大师-debug.apk
          ls -lh artifacts/
          echo "SHA256:" > artifacts/SHA256.txt
          sha256sum artifacts/*.apk >> artifacts/SHA256.txt
          cat artifacts/SHA256.txt

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: artifacts/

      # 在分支最新一次提交上发布固定 tag 的 Release，
      # 这样下载地址始终稳定、可直接安装
      - name: 发布到 Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: 钓鱼大师 · ${{ github.ref_name }} (${{ github.run_number }})
          body: |
            自动构建产物

            - 提交: `${{ github.sha }}`
            - 分支: `${{ github.ref_name }}`
            - 构建: #${{ github.run_number }}
          files: |
            artifacts/钓鱼大师-release.apk
            artifacts/钓鱼大师-debug.apk
            artifacts/SHA256.txt
          prerelease: true
          make_latest: false
