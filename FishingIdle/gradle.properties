org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# 广告 SDK（快手等）内部仍引用 android.support.* ：
# 不开 jetifier 时基类 android.support.v4.content.FileProvider 找不到，
# 表现为启动即崩在清单声明的 provider 上（ClassNotFoundException:
# com.smartdigimkt.dlopt.common.ApkFileProvider）。参考项目同款开关，别关。
android.enableJetifier=true

kotlin.code.style=official
